name: Deploy website to Hong Kong and GitHub Pages

env:
  WC_HUGO_VERSION: '0.135.0'

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build website
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true
      - uses: actions/cache@v4
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
          hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Publish the same built files to the primary Hong Kong host.
  deploy-hong-kong:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/homepage-artifact
      - name: Extract built site
        run: |
          mkdir public
          tar -xf "$RUNNER_TEMP/homepage-artifact/artifact.tar" -C public
          test -s public/index.html
          test -s public/en/index.html
      - name: Synchronize Hong Kong host
        env:
          HOMEPAGE_DEPLOY_KEY: ${{ secrets.HOMEPAGE_DEPLOY_KEY }}
          HOMEPAGE_KNOWN_HOSTS: ${{ secrets.HOMEPAGE_KNOWN_HOSTS }}
        run: |
          : "${HOMEPAGE_DEPLOY_KEY:?HOMEPAGE_DEPLOY_KEY is required}"
          : "${HOMEPAGE_KNOWN_HOSTS:?HOMEPAGE_KNOWN_HOSTS is required}"
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/homepage-ssh.XXXXXX")
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$HOMEPAGE_DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$HOMEPAGE_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -F 149.88.85.148 -f "$ssh_dir/known_hosts" > /dev/null
          rsync -rltz --delay-updates --delete-delay --chmod=D755,F644 \
            -e "ssh -i '$ssh_dir/key' -o UserKnownHostsFile='$ssh_dir/known_hosts' -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=15" \
            public/ fanzengpages@149.88.85.148:./

  # Deploy website to GitHub Pages hosting
  deploy:
    if: github.repository_owner != 'HugoBlox'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
