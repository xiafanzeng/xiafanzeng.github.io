<!-- CN access optimization: remove cookie consent CDN dependency -->
{{- with site.Params.visitor_stats -}}
  {{- $script := resources.Get "js/visitor-stats.js" | minify | fingerprint "sha256" -}}
  <script defer src="{{ $script.RelPermalink }}"
          integrity="{{ $script.Data.Integrity }}"
          data-domain="{{ .domain }}"
          data-website-id="{{ .website_id }}"
          data-script-url="{{ .script_url }}"
          data-host-url="{{ .host_url }}"
          data-totals-url="{{ .totals_url }}"></script>
{{- end -}}
